name: Vote Party Watchdog

# Independent safety net for the self-chaining collector. If the chain dies
# (a run errored before dispatching its successor, the PAT lapsed, GitHub
# dropped the scheduled kick, etc.), collection silently stops and every
# downstream metric quietly rots. This watchdog runs on its OWN schedule,
# checks how stale the committed data is, and if the chain looks dead it both
# (a) revives collection directly (a short window it commits itself, needing no
# PAT) and (b) re-dispatches the main workflow to restart the chain.
#
# It uses a SEPARATE concurrency group from the main workflow so it can always
# run to check freshness, even while a healthy 55-min window is mid-flight.

on:
  schedule:
    - cron: "*/20 * * * *"   # best-effort; only acts when data is stale
  workflow_dispatch:

concurrency:
  group: voteparty-watchdog
  cancel-in-progress: false

permissions:
  contents: write

env:
  STALE_MIN: "85"            # a healthy chain commits every ~57 min; >85 = dead

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check data freshness
        id: check
        run: |
          age=$(python3 - <<'PY'
          import json, datetime
          try:
              with open("data/voteparty.jsonl") as fh:
                  last = [l for l in fh if l.strip()][-1]
              ts = json.loads(last)["timestamp"]
              t = datetime.datetime.strptime(ts, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
              age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 60
          except Exception:
              age = 99999
          print(int(age))
          PY
          )
          echo "age_min=$age" >> "$GITHUB_OUTPUT"
          echo "Last committed data point is ${age} min old (stale threshold: ${STALE_MIN})."
          if [ "$age" -lt "$STALE_MIN" ]; then echo "stale=false" >> "$GITHUB_OUTPUT"; echo "Chain healthy."; else echo "stale=true" >> "$GITHUB_OUTPUT"; echo "STALE — chain appears dead, reviving."; fi

      - name: Set up Python
        if: steps.check.outputs.stale == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revive collection directly (no PAT needed)
        if: steps.check.outputs.stale == 'true'
        run: |
          mkdir -p data
          # short 10-min window so the watchdog itself stays cheap
          python3 voteparty_tracker.py --duration 600 -i 60 \
            -f data/voteparty.log --json data/voteparty.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/voteparty.log data/voteparty.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "watchdog: revive collection (chain was stale $(date -u +%Y-%m-%dT%H:%M:%SZ))"
            for a in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((a * 2))
            done
          fi

      - name: Restart the self-chain
        if: steps.check.outputs.stale == 'true'
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$WORKFLOW_PAT" ]; then
            echo "No WORKFLOW_PAT — cannot re-dispatch; main cron will pick up. Revival above still ran."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $WORKFLOW_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/voteparty.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}") || true
          echo "chain restart dispatch HTTP $code (204 = ok)"
