name: Vote Party Tracker

# Collects EarthMC vote party data and commits it to the repo under data/.
#
# SELF-CHAINING: GitHub's scheduled cron is best-effort and skips multi-hour
# stretches (we measured only ~33% time coverage from cron alone). To close the
# gaps, each run polls for a 55-minute window and then **dispatches the next run
# itself**, so windows run back-to-back with ~100% coverage instead of waiting
# on the scheduler.
#
# The default GITHUB_TOKEN is blocked from triggering workflows (GitHub's loop
# guard), so the self-dispatch needs a Personal Access Token in the repo secret
# WORKFLOW_PAT (fine-grained, this repo, Actions: read+write). Without it the
# workflow still runs — it just falls back to the hourly cron (with gaps).
#
# To STOP the chain: disable the workflow in the Actions tab (or remove the PAT).

on:
  # Safety-net / bootstrap. The real cadence comes from self-chaining; this
  # restarts the chain if a run ever dies before dispatching the next.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Serialize runs: a dispatched/queued run waits for the current one, then starts
# immediately when it ends — giving seamless back-to-back windows.
concurrency:
  group: voteparty-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chain next run (self-chaining; needs WORKFLOW_PAT)
        # Dispatch early so the next window is queued even if a later step fails;
        # concurrency makes it wait until THIS run finishes, then start at once.
        # The PAT check is done in-script (not in `if:`) so the log always shows
        # exactly what happened.
        if: ${{ always() }}
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$WORKFLOW_PAT" ]; then
            echo "WORKFLOW_PAT secret is EMPTY/unset — self-chain disabled, relying on cron."
            echo "Fix: add it as an *Actions repository secret* named exactly WORKFLOW_PAT."
            exit 0
          fi
          echo "WORKFLOW_PAT is present (len=${#WORKFLOW_PAT}); dispatching next run..."
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $WORKFLOW_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/voteparty.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}") || true
          echo "self-dispatch HTTP $code (204 = queued OK)"
          if [ "$code" != "204" ]; then
            echo "response body:"; cat /tmp/resp.txt || true
            echo "→ 403/404 usually means the PAT lacks 'Actions: read and write' on this repo."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll vote party endpoint for a 55-minute window
        run: |
          mkdir -p data
          # 55-min window, 5-min polling; tracker auto-drops to 60s above 90%
          # so a firing inside the window is tightly bracketed.
          python3 voteparty_tracker.py --duration 3300 -i 300 \
            -f data/voteparty.log \
            --json data/voteparty.jsonl

      - name: Install prediction dependencies
        run: pip install -r requirements.txt

      - name: Update prediction & graph
        run: python3 predict.py -i data/voteparty.jsonl -o data

      - name: Update stage-wise accuracy backtest
        run: python3 accuracy.py -i data/voteparty.jsonl -o data || true

      - name: Update model performance report
        run: python3 model_report.py -i data/voteparty.jsonl -o data || true

      - name: Update stage-by-stage replay
        run: python3 replay.py -i data/voteparty.jsonl -o data/replay.png || true

      - name: Update out-of-sample prediction track record
        run: python3 predlog.py -i data/voteparty.jsonl -o data || true

      - name: Update all-cycles overview graph
        run: python3 cycles_graph.py -i data/voteparty.jsonl -o data/cycles.png || true

      - name: Update experimental NHPP diagnostic
        run: python3 nhpp.py -i data/voteparty.jsonl -o data || true

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/voteparty.log data/voteparty.jsonl \
            data/prediction.png data/prediction.json data/PREDICTION.md \
            data/accuracy.png data/accuracy.json \
            data/model_report.png data/model_report.json data/model_report.md \
            data/replay.png \
            data/prediction_track.png data/predictions_log.jsonl data/PREDICTION_LOG.md \
            data/cycles.png \
            data/nhpp.png data/nhpp.json
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "chore: vote party data window ending $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 2))
          done
