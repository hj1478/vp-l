name: Vote Party Tracker

# Collects EarthMC vote party data and commits it to the repo under data/.
#
# GitHub's scheduled cron is best-effort and gets heavily delayed, so instead
# of one poll per firing we fire ~hourly and let each run poll continuously for
# a 55-minute window (every 5 min). That gives near-continuous 5-minute data
# regardless of exactly when GitHub actually starts the run.

on:
  # Fire roughly hourly. Each run covers ~55 minutes, so back-to-back firings
  # give near-continuous coverage.
  schedule:
    - cron: "0 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Never let two runs commit at the same time; queue a delayed run instead.
concurrency:
  group: voteparty-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll vote party endpoint for a 55-minute window
        run: |
          mkdir -p data
          # 3300s = 55 min, polling every 5 min (-i 300) -> ~11 points per run.
          python3 voteparty_tracker.py --duration 3300 -i 300 \
            -f data/voteparty.log \
            --json data/voteparty.jsonl

      - name: Install prediction dependencies
        run: pip install -r requirements.txt

      - name: Update ensemble prediction & graph
        run: python3 predict.py -i data/voteparty.jsonl -o data

      - name: Update stage-wise accuracy backtest
        run: python3 accuracy.py -i data/voteparty.jsonl -o data || true

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/voteparty.log data/voteparty.jsonl \
            data/prediction.png data/prediction.json data/PREDICTION.md \
            data/accuracy.png data/accuracy.json
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "chore: vote party data window ending $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Rebase onto any commits added by an earlier run, then push.
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 2))
          done
