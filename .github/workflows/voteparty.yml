name: Vote Party Tracker

# Collects EarthMC vote party data into data/voteparty.jsonl / .log. Analysis and
# graphs live in a SEPARATE workflow (analysis.yml) so collection stays lean.
#
# COST-GATED collection. Precise firing capture only matters near the top of the
# cycle, so we don't keep a runner alive 24/7 anymore. Instead:
#   * Every 10 min a CHEAP one-shot poll (--once, ~30-45s) records the current %
#     and commits it — this alone gives a continuous coarse VP history.
#   * Only when % >= GATE_PCT do we spin up the continuous fast-poll window
#     (5-min polling, auto-dropping to 60s above 90%) AND self-chain, so a firing
#     is tightly bracketed. When % falls back below the gate the chain stops.
# This cuts continuous-runner time from ~1,440 min/day to a few hours near each
# firing (~300-370 min/day) while keeping the firing moment tightly captured.
#
# SELF-CHAINING (only while hot) needs a PAT in the repo secret WORKFLOW_PAT
# (fine-grained, this repo, Actions: read+write). Without it collection still
# works off the 10-min cron; it just won't tighten into a back-to-back window.

on:
  schedule:
    - cron: "*/10 * * * *"   # cheap gate check; fast-window only kicks in when hot
  workflow_dispatch:

concurrency:
  group: voteparty-tracker
  cancel-in-progress: false

permissions:
  contents: write

env:
  GATE_PCT: "80"             # at/above this % of target, enter continuous fast-poll

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    env:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cheap one-shot poll + gate decision
        id: gate
        run: |
          mkdir -p data
          # One poll, appended to the raw log — this is the coarse continuous record.
          python3 voteparty_tracker.py --once \
            -f data/voteparty.log --json data/voteparty.jsonl || true
          pct=$(python3 - <<'PY'
          import json
          pct = None
          try:
              with open("data/voteparty.jsonl") as fh:
                  last = [l for l in fh if l.strip()][-1]
              pct = json.loads(last).get("percent")
          except Exception:
              pct = None
          print(pct if pct is not None else -1)
          PY
          )
          echo "current vote party: ${pct}% (gate ${GATE_PCT}%)"
          hot=$(python3 -c "import sys; print('1' if float('$pct') >= float('$GATE_PCT') else '0')" 2>/dev/null || echo 0)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "hot=$hot" >> "$GITHUB_OUTPUT"
          [ "$hot" = "1" ] && echo "HOT — entering fast-poll window." || echo "idle — one cheap sample only."

      - name: Commit the sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/voteparty.log data/voteparty.jsonl
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "chore: vote party sample $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for a in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((a * 2))
          done
          [ "$ok" = 1 ] || { echo "::error::sample push failed"; exit 1; }

      - name: Chain next window (only while hot; needs WORKFLOW_PAT)
        if: ${{ always() && steps.gate.outputs.hot == '1' }}
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$WORKFLOW_PAT" ]; then
            echo "WORKFLOW_PAT empty — no self-chain; the 10-min cron keeps sampling."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $WORKFLOW_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/voteparty.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}") || true
          echo "self-dispatch HTTP $code (204 = queued OK)"
          [ "$code" = "204" ] || { echo "response:"; cat /tmp/resp.txt || true; }

      - name: Fast-poll window (only while hot; 55 min, tightens near firing)
        if: ${{ steps.gate.outputs.hot == '1' }}
        run: |
          mkdir -p data
          # 55-min window, 5-min polling; auto-drops to 60s above 90% so a firing
          # inside the window is tightly bracketed.
          python3 voteparty_tracker.py --duration 3300 -i 300 \
            -f data/voteparty.log \
            --json data/voteparty.jsonl

      - name: Commit window data (only while hot)
        if: ${{ steps.gate.outputs.hot == '1' }}
        run: |
          git add -f data/voteparty.log data/voteparty.jsonl
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "chore: vote party window ending $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for a in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((a * 2))
          done
          [ "$ok" = 1 ] || { echo "::error::window push failed — data NOT saved"; exit 1; }
