name: Critical Fall Watch

# Minute-resolution capture of towns about to fall. When a pinned/watchlist town's
# mayor is within ~1 day of the 42-day threshold (idle >= 41d), this fast-polls it
# every ~90s in a self-chaining window so we catch the EXACT heir at the fall —
# including a snipe-and-dip that lasts only minutes (the hourly watch missed
# Neo_Osaka's real heir for exactly that reason). When nothing is critical it exits
# in one cheap pass and does not chain.

on:
  schedule:
    - cron: "*/15 * * * *"   # frequent check; only fast-watches when something is critical
  workflow_dispatch:

concurrency:
  group: critical-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect critical (about-to-fall) towns
        id: detect
        run: |
          python3 imminent_watch.py --critical-only | tee /tmp/iw.txt || true
          n=$(grep -oE 'CRITICAL_COUNT=[0-9]+' /tmp/iw.txt | tail -1 | cut -d= -f2)
          n=${n:-0}
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "critical towns: $n"

      - name: Chain next fast-watch window (only while critical)
        if: ${{ always() && steps.detect.outputs.count != '0' }}
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          [ -z "$WORKFLOW_PAT" ] && { echo "no PAT; cron will re-check every 15 min"; exit 0; }
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $WORKFLOW_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/critical_watch.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}") || true
          echo "self-dispatch HTTP $code (204 = queued)"

      - name: Fast-watch the fall (minute resolution, ~50-min window)
        if: ${{ steps.detect.outputs.count != '0' }}
        run: |
          python3 imminent_watch.py --critical-only --loop --duration 3000 --interval 90 || true

      - name: Commit dense snapshots
        if: ${{ steps.detect.outputs.count != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/imminent_watch.jsonl
          if git diff --cached --quiet; then echo "no new snapshots"; exit 0; fi
          git commit -m "critical-watch: dense fall snapshots $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for a in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((a * 2))
          done
          [ "$ok" = 1 ] || { echo "::error::critical-watch push failed"; exit 1; }
