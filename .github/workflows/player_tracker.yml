name: Player Activity Tracker

# Polls the online status of the players listed in players.txt (plus every
# resident of the towns in towns.txt) and commits the raw log to
# data/players.jsonl / players.log. Sessions + playtime charts are regenerated
# by the Analysis workflow (player_activity.py).
#
# COST NOTE: this used to run a continuous 55-minute self-chaining window, which
# kept a runner alive ~24/7 (~1,440 Actions minutes/day). Activity tracking only
# needs coarse online/offline sampling — a login session spanning tens of minutes
# is still caught at ~10-minute resolution, and playtime is a sum that a missed
# sample only slightly undercounts. So we now take ONE cheap sample per cron tick
# (~30-45s of runner time) instead. ~10-min resolution, ~110 min/day — a ~90%
# cut with no meaningful loss for session/playtime reconstruction.

on:
  schedule:
    - cron: "*/10 * * * *"   # one sample every 10 min (cheap; no self-chain)
  workflow_dispatch:

concurrency:
  group: player-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for configured players
        id: cfg
        run: |
          n=$(grep -v '^[[:space:]]*#' players.txt 2>/dev/null | grep -c '[^[:space:]]' || true)
          tn=$(grep -v '^[[:space:]]*#' towns.txt 2>/dev/null | grep -c '[^[:space:]]' || true)
          echo "count=$n players, $tn towns"
          if [ "$n" -gt 0 ] || [ "$tn" -gt 0 ]; then echo "has=1" >> "$GITHUB_OUTPUT"; echo "$n player(s) + $tn town(s) configured."; \
          else echo "has=0" >> "$GITHUB_OUTPUT"; echo "No players or towns configured — nothing to do."; fi

      - name: Sample players once
        if: ${{ steps.cfg.outputs.has == '1' }}
        run: |
          mkdir -p data
          python3 player_tracker.py --once \
            --players-file players.txt --towns-file towns.txt \
            --json data/players.jsonl --log data/players.log

      - name: Commit raw player data
        if: ${{ steps.cfg.outputs.has == '1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/players.jsonl data/players.log
          if git diff --cached --quiet; then
            echo "No new player data to commit."
            exit 0
          fi
          git commit -m "chore: player activity sample $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          [ "$ok" = 1 ] || { echo "::error::push failed after 4 attempts — data NOT saved"; exit 1; }
