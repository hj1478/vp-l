name: Player Activity Tracker

# Polls the online status of the players listed in players.txt and commits the
# raw log to data/players.jsonl / players.log. Sessions + playtime charts are
# regenerated by the Analysis workflow (player_activity.py).
#
# Mirrors the vote-party collector: it self-chains (dispatches its own successor
# early via WORKFLOW_PAT) for continuous coverage, and only does so when at least
# one player is configured — so an empty players.txt costs nothing and never
# spins. Add names to players.txt to switch it on.

on:
  schedule:
    - cron: "5 * * * *"      # bootstrap/safety-net; real cadence is the self-chain
  workflow_dispatch:

concurrency:
  group: player-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for configured players
        id: cfg
        run: |
          n=$(grep -v '^[[:space:]]*#' players.txt 2>/dev/null | grep -c '[^[:space:]]' || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then echo "has=1" >> "$GITHUB_OUTPUT"; echo "$n player(s) configured."; \
          else echo "has=0" >> "$GITHUB_OUTPUT"; echo "No players in players.txt — nothing to do."; fi

      - name: Chain next run (only when players are configured)
        if: ${{ always() && steps.cfg.outputs.has == '1' }}
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$WORKFLOW_PAT" ]; then
            echo "No WORKFLOW_PAT — self-chain disabled, relying on hourly cron."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $WORKFLOW_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/player_tracker.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}") || true
          echo "self-dispatch HTTP $code (204 = queued OK)"

      - name: Poll players for a 55-minute window
        if: ${{ steps.cfg.outputs.has == '1' }}
        run: |
          mkdir -p data
          python3 player_tracker.py --duration 3300 -i 300 \
            --players-file players.txt \
            --json data/players.jsonl --log data/players.log

      - name: Commit raw player data
        if: ${{ steps.cfg.outputs.has == '1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/players.jsonl data/players.log
          if git diff --cached --quiet; then
            echo "No new player data to commit."
            exit 0
          fi
          git commit -m "chore: player activity window ending $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          [ "$ok" = 1 ] || { echo "::error::push failed after 4 attempts — data NOT saved"; exit 1; }
