name: Town Fall Observatory

# Focused town-fall observatory. Rather than log all ~5,600 towns, it first scans
# every town's mayor and builds a WATCHLIST of towns whose mayor is going inactive
# (approaching the ~42-day fall threshold) — the only towns that can produce a
# "most active resident" event — then densely sweeps just those to detect the fall
# and capture resident activity at the moment. Ground truth for reverse-engineering
# the inheritance rule (town_candidates.py / town_observatory.py / fall_analysis.py).
#
# Stdlib only, paced batches. Runs every 6 hours; a mayor stays inactive for weeks
# before falling, so the daily-refreshed watchlist always flags a town well before
# it falls, and missed runs don't lose events.

on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours, offset from the other workflows
  workflow_dispatch:

concurrency:
  group: town-observatory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh at-risk watchlist (scan every mayor)
        run: python3 town_candidates.py --min-idle-days 25 -o data/watch_towns.json

      - name: Sweep the watchlist + detect fall events
        run: python3 town_observatory.py --watchlist data/watch_towns.json

      - name: Re-run fall analysis
        run: python3 fall_analysis.py -i data/town_events.jsonl -o data || true

      - name: Commit observatory data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in watch_towns.json snipe_list.json town_state.json town_events.jsonl observatory.json fall_analysis.json; do
            [ -f "data/$f" ] && git add -f "data/$f" || true
          done
          if git diff --cached --quiet; then
            echo "No observatory changes to commit."
            exit 0
          fi
          git commit -m "chore: town observatory sweep $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          [ "$ok" = 1 ] || { echo "::error::observatory push failed"; exit 1; }
